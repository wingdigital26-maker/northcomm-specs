<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#353535">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" id="favIcon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20211f;--sub:#5c5f5a;--signal:#FF3800;--signal-ink:#c72c00;
    --paper:#fbfaf7;--line:#dcdad4;--line-strong:#c4c1b8;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    color-scheme:light;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
  img{max-width:100%}

  /* top bar (matches index/privacy/support) */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(251,250,247,.92);backdrop-filter:saturate(1.1) blur(6px);border-bottom:1px solid var(--line-strong)}
  .topbar .bar{max-width:1080px;margin:0 auto;padding:0 clamp(18px,4vw,40px);display:flex;align-items:center;gap:14px;height:58px}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-height:44px}
  .brand .logo{height:24px;width:auto;display:block}
  .brand .tagline{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--sub);padding-left:12px;border-left:1px solid var(--line-strong)}
  .topbar .spacer{flex:1}
  .toplink{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--sub);text-decoration:none;padding:8px 4px}
  .toplink:hover{color:var(--ink)}
  @media (max-width:600px){.brand .tagline{display:none}}

  .wrap{max-width:680px;margin:0 auto;padding:min(18vh,140px) 22px 60px}
  .idx{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.05em;color:var(--sub);text-transform:uppercase;display:flex;align-items:center;gap:9px;margin-bottom:18px}
  .idx b{color:var(--signal-ink);font-weight:600}
  h1{font-family:var(--cond);font-weight:700;font-size:clamp(34px,7vw,56px);letter-spacing:-.015em;line-height:1;margin-bottom:14px}
  p.lede{color:var(--sub);font-size:15.5px;max-width:46ch;line-height:1.6;margin-bottom:30px}
  .back{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;font-family:var(--cond);font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;padding:13px 20px;cursor:pointer;text-decoration:none;background:var(--ink);color:#fff;transition:background .15s}
  .back:hover{background:#000}

  footer .fine{max-width:680px;margin:0 auto;padding:20px 22px 40px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
  footer .fine a{text-decoration:none;color:var(--sub);min-height:44px;display:inline-flex;align-items:center}
  footer .fine a:hover{color:var(--ink)}
  footer .fine .push{margin-left:auto}
</style>
</head>
<body>

<header class="topbar">
  <div class="bar">
    <a class="brand" href="." data-base-href="" id="brandLink">
      <img class="logo" src="northcomm-logo.png" data-base-src="northcomm-logo.png" alt="Northcomm Technologies" width="600" height="126">
      <span class="tagline">Spec Lookup</span>
    </a>
    <span class="spacer"></span>
    <a class="toplink" href="." data-base-href="">Spec Lookup</a>
  </div>
</header>

<div class="wrap">
  <div class="idx"><b>404</b> / Not found</div>
  <h1>That page doesn't exist.</h1>
  <p class="lede">The link may be old or mistyped. The spec lookup tool is still at the address below if you have a serial to look up.</p>
  <a class="back" href="." data-base-href="">&larr; Go to Spec Lookup</a>
</div>

<footer>
  <div class="fine">
    <span>Northcomm Technologies</span>
    <span>RF cable assembly test records</span>
    <span class="push"></span>
    <a href="privacy.html" data-base-href="privacy.html">Privacy</a>
    <a href="support.html" data-base-href="support.html">Support</a>
  </div>
</footer>

<script>
(function(){
  "use strict";
  // Derive the site base at runtime so this page works both at the current
  // github.io subpath (/northcomm-specs/...) and at a future custom-domain root.
  var m = /^(\/northcomm-specs\/)/.exec(location.pathname);
  var base = m ? m[1] : "/";
  document.querySelectorAll("[data-base-href]").forEach(function(el){
    var rel = el.getAttribute("data-base-href");
    el.setAttribute("href", base + rel);
  });
  document.querySelectorAll("[data-base-src]").forEach(function(el){
    var rel = el.getAttribute("data-base-src");
    el.setAttribute("src", base + rel);
  });
  var fav = document.getElementById("favIcon");
  if(fav) fav.setAttribute("href", base + "icon-192.png");
})();
</script>
</body>
</html>
